---
name: Perl Critic

# Lints the Perl code with Perl::Critic and the POD with podchecker
# (issue #12).  Both gate the build: the severity-5 perlcritic
# baseline was triaged to zero findings in issue #12 step 2, and
# podchecker failures block from day one.

on:
  push:
    branches:
      - main
  pull_request:

# global permissions
permissions: {}

jobs:
  perlcritic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show perl version
        run: perl -v

      - name: Install Perl::Critic
        run: |
          sudo apt-get update
          sudo apt-get install -y libperl-critic-perl

      - name: Run perlcritic
        # Severity 5 (.perlcriticrc); the baseline was triaged to zero
        # in issue #12, so findings block the build again.
        run: perlcritic lib t bin/*

      - name: POD syntax check
        run: podchecker lib/Lego/*.pm bin/*
